name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Diagnostic - Check Environment
        run: |
          echo "=== Environment Diagnostics ==="
          echo "JEKYLL_ENV: $JEKYLL_ENV"
          echo "GOOGLE_API_KEY set: $([ -n "$GOOGLE_API_KEY" ] && echo 'YES' || echo 'NO')"
          echo "GOOGLE_API_KEY length: ${#GOOGLE_API_KEY}"
          if [ -n "$GOOGLE_API_KEY" ]; then
            echo "GOOGLE_API_KEY starts with: ${GOOGLE_API_KEY:0:10}..."
            echo "GOOGLE_API_KEY ends with: ...${GOOGLE_API_KEY: -10}"
          fi
        env:
          JEKYLL_ENV: production
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Build with Jekyll
        run: |
          export JEKYLL_ENV=production
          export GOOGLE_API_KEY="$GOOGLE_API_KEY"
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
