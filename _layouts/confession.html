    <a href="{{ '/liturgy/' | relative_url }}" class="back-to-liturgies-btn"><span class="kick-arrow" aria-hidden="true">←</span> Liturgy</a>
  </div>

  {{ content }}

<script>
var _pageAudio;
function playPageAudio(src) {
  if (_pageAudio) { _pageAudio.pause(); _pageAudio.currentTime = 0; }
  _pageAudio = new Audio(src);
  _pageAudio.play().catch(function(e) { console.error('Audio error:', e); });
}
</script>
<script src="{{ '/assets/js/rite.js' | relative_url }}" defer></script>
