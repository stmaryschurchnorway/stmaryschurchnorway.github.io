---
layout: default
---

<div class="confession-page" data-sacrament="{{ page.sacrament }}">
  <div class="carousel-back-nav" id="backToLiturgies">
    <a href="{{ '/liturgy/' | relative_url }}" class="back-to-liturgies-btn">
      <span aria-hidden="true">←</span> Back to Liturgies
    </a>
  </div>

  {{ content }}
</div>

<script>
var _pageAudio;
function playPageAudio(src) {
  if (_pageAudio) { _pageAudio.pause(); _pageAudio.currentTime = 0; }
  _pageAudio = new Audio(src);
  _pageAudio.play().catch(function(e) { console.error('Audio error:', e); });
}
</script>
