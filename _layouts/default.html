<!DOCTYPE html>
<html lang="{% if page.url contains '/no/' %}no{% else %}en{% endif %}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="icon" type="image/png" href="{{ '/assets/img/logo.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/logo.png' | relative_url }}">
  {% seo %}
  {% feed_meta %}
  {% include church-schema.html %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% for css in page.extra_css %}<link rel="stylesheet" href="{{ css | relative_url }}">
  {% endfor %}
  {% for url in page.preconnect %}<link rel="preconnect" href="{{ url }}">
  {% endfor %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
</head>
<body>

{% include header.html %}

<main>
  {{ content }}
</main>

{% include footer.html %}

<!-- Back to Top -->
<button class="back-to-top" aria-label="Back to top">&#8593;</button>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" aria-label="Close">&times;</button>
  <img class="lightbox-img" id="lightbox-img" alt="Full size image">
</div>

<script>
  // Fetch next event from Google Calendar
  (function() {
    var el = document.getElementById('next-event');
    if (!el) return;
    var apiKey = '{{ site.google_api_key }}';
    var calId = '{{ site.google_calendar_id }}';
    var now = new Date().toISOString();
    var url = 'https://www.googleapis.com/calendar/v3/calendars/' +
      encodeURIComponent(calId) +
      '/events?key=' + apiKey +
      '&timeMin=' + encodeURIComponent(now) +
      '&maxResults=1&singleEvents=true&orderBy=startTime';

    fetch(url).then(function(r) { return r.json(); }).then(function(data) {
      if (data.items && data.items.length > 0) {
        var ev = data.items[0];
        var title = ev.summary || 'Event';
        var start = ev.start.dateTime || ev.start.date;
        var d = new Date(start);
        var opts = { weekday: 'short', month: 'short', day: 'numeric' };
        var dateStr = d.toLocaleDateString('en-US', opts);
        if (ev.start.dateTime) {
          dateStr += ' at ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        }
        while (el.firstChild) el.removeChild(el.firstChild);
        var label = document.createElement('span');
        label.className = 'event-label';
        label.textContent = 'Upcoming: ';
        el.appendChild(label);
        el.appendChild(document.createTextNode(title + ' — ' + dateStr));

        var card = document.getElementById('next-event-card');
        if (card) {
          var lbl = card.querySelector('.next-event-label');
          while (card.lastChild !== lbl) card.removeChild(card.lastChild);

          var dateRow = document.createElement('div');
          dateRow.className = 'next-event-date-row';
          var dayEl = document.createElement('span');
          dayEl.className = 'next-event-day';
          dayEl.textContent = String(d.getDate()).padStart(2, '0');
          var monthEl = document.createElement('span');
          monthEl.className = 'next-event-month';
          monthEl.textContent = d.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
          var wdEl = document.createElement('span');
          wdEl.className = 'next-event-weekday';
          wdEl.textContent = d.toLocaleDateString('en-US', { weekday: 'long' });
          dateRow.appendChild(dayEl);
          dateRow.appendChild(monthEl);
          dateRow.appendChild(wdEl);
          if (ev.start.dateTime) {
            var timeEl = document.createElement('span');
            timeEl.className = 'next-event-time';
            timeEl.textContent = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            dateRow.appendChild(timeEl);
          }
          card.appendChild(dateRow);

          var titleEl = document.createElement('div');
          titleEl.className = 'next-event-title';
          titleEl.textContent = title;
          card.appendChild(titleEl);

          var detailEl = document.createElement('div');
          detailEl.className = 'next-event-detail';
          if (ev.location) {
            detailEl.textContent = ev.location;
          } else if (!ev.start.dateTime) {
            detailEl.textContent = 'All day';
          }
          card.appendChild(detailEl);

          var footer = document.createElement('div');
          footer.className = 'next-event-footer';
          var link = document.createElement('a');
          link.className = 'next-event-link';
          link.href = '/en/events/';
          link.textContent = 'See all gatherings →';
          footer.appendChild(link);
          card.appendChild(footer);
        }
      } else {
        el.textContent = 'No upcoming events';
      }
    }).catch(function() {
      // Leave default content untouched on error
    });
  })();

  // Back to top
  (function() {
    var btn = document.querySelector('.back-to-top');
    window.addEventListener('scroll', function() {
      btn.classList.toggle('visible', window.scrollY > 400);
    });
    btn.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  })();

  // Decode obfuscated email links
  (function() {
    document.querySelectorAll('.email-link').forEach(function(link) {
      var encoded = link.getAttribute('data-email');
      if (encoded) {
        var email = atob(encoded);
        link.href = 'mailto:' + email;
        if (!link.textContent || link.textContent === 'Email us') {
          link.textContent = email;
        }
      }
    });
  })();

  // Lightbox
  (function() {
    var box = document.getElementById('lightbox');
    var img = document.getElementById('lightbox-img');
    document.querySelectorAll('.lightbox-link').forEach(function(link) {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        img.src = this.href;
        box.classList.add('open');
      });
    });
    box.addEventListener('click', function(e) {
      if (e.target !== img) {
        box.classList.remove('open');
        img.src = '';
      }
    });
  })();
</script>
<script data-goatcounter="https://stmaryschurchnorway.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script>
(function() {
  var el = document.getElementById('visitor-count');
  if (!el) return;
  var r = new XMLHttpRequest();
  r.open('GET', 'https://stmaryschurchnorway.goatcounter.com/counter/' + encodeURIComponent(location.pathname) + '.json');
  r.onload = function() {
    if (r.status === 200) {
      var data = JSON.parse(r.responseText);
      el.textContent = 'Visitors: ' + data.count_unique;
    }
  };
  r.send();
})();
</script>
<script src="{{ '/assets/js/site-enhance.js' | relative_url }}" defer></script>
</body>
</html>
