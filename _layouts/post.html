---
layout: default
---

<section class="page-banner">
  <h1>{{ page.title }}</h1>
</section>

<article class="page-content">
  <div class="container">
    <div class="post-back-nav">
      <a href="{{ '/' | relative_url }}" class="post-back-btn">
        <span aria-hidden="true">←</span> Back to Home
      </a>
    </div>
    <p class="post-date">{{ page.date | date: "%B %d, %Y" }}</p>
    {{ content }}
  </div>
</article>
