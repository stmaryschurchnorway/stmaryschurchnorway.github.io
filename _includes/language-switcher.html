<!-- Language Switcher -->
<div class="language-switcher" aria-label="Select language">
  {% if page.url contains '/no/' %}
    <a href="{{ page.url | replace: '/no/', '/en/' }}" class="lang-link" lang="en" hreflang="en">EN</a>
    <span class="lang-separator" aria-hidden="true">|</span>
    <span class="lang-current" aria-current="page">NO</span>
  {% else %}
    <span class="lang-current" aria-current="page">EN</span>
    <span class="lang-separator" aria-hidden="true">|</span>
    <a href="{{ page.url | replace: '/en/', '/no/' }}" class="lang-link" lang="no" hreflang="no">NO</a>
  {% endif %}
</div>
