# ---- Kid-friendly glossary (tap any term for a quick definition) ----
glossary:
  Chrismation: "The sacrament of being sealed with the Holy Spirit, right after Baptism. Also called Holy Mooron."
  Mooron: "Holy oil — a sweet-smelling mix of olive oil, balsam, wine and forty spices — used to seal us with the Holy Spirit."
  Hatma: "A Syriac word meaning ‘the seal.’ The anointing marks us as belonging to God forever."
  balsam: "A fragrant, healing tree-sap mixed into the Holy Mooron for its sweet smell."
  Pentecost: "The day the Holy Spirit came down on the apostles like tongues of fire, fifty days after Easter."
  Catholicos: "The chief bishop who consecrates the Holy Mooron for the whole Church."
  Baptism: "The sacrament of being born again in water — washing away sin and joining us to Christ."
  Apostles: "The twelve closest followers Jesus chose to lead His Church."

# ---- Per-stage simplified text + “Did you know?” (Shlomo, kids mode) ----
stageExtras:
  "The Fulfillment of Baptism":
    simple: "Baptism makes us part of God's family. Holy Mooron is the very next step — God gives us His Holy Spirit to help us live as His children."
    dyk:
      q: "Do Baptism and Mooron go together?"
      a: "Yes! They happen one right after the other — first the water of Baptism, then the sweet oil of Mooron."
  "Scriptural Roots — Baptism & Pentecost":
    simple: "When Jesus was baptized, the Holy Spirit came down like a dove. The same Spirit comes to us through the Holy Mooron."
    dyk:
      q: "What came down at Pentecost?"
      a: "Little flames of fire rested on each apostle, and they were filled with the Holy Spirit!"
  "The Seal — Identity & Protection":
    simple: "The Mooron is like God's special stamp on us. It says, ‘This one is Mine!’ — and it never washes off."
    dyk:
      q: "Can the seal of Mooron ever come off?"
      a: "Never! It's forever. That's why Mooron is only done once in your whole life."
  "The Holy Myron — Sacred Composition":
    simple: "The Holy Mooron is made from olive oil, sweet balsam, wine, and forty kinds of spices — so it smells beautiful, like heaven."
    dyk:
      q: "How often is new Mooron made?"
      a: "Only about once every ten years — and the whole Church gathers with the Catholicos to bless it!"
  "The Anointing Ceremony":
    simple: "The priest dips his thumb in the holy oil and makes little crosses — on the forehead, eyes, ears, hands and feet — blessing every part of you."
    dyk:
      q: "Where does the priest anoint?"
      a: "From head to toe! Eyes to see good, ears to hear God, hands to do kind things, and feet to walk the right way."
  "A Personal Pentecost":
    simple: "Pentecost was a big day for the whole Church. Mooron is like your very own Pentecost — the Holy Spirit comes just for you."
    dyk:
      q: "Is Mooron my own Pentecost?"
      a: "Yes! The same Holy Spirit who came to the apostles comes to you in the Holy Mooron."
  "The Permanence of the Seal":
    simple: "Some things we do again and again, like Holy Communion. But Mooron happens just once — because God's seal lasts forever."
    dyk:
      q: "Why is Mooron done only once?"
      a: "Because God's seal never wears out! Once you're marked as His, you're His for always."
  "Living as the Anointed":
    simple: "Being anointed means God chose you for something good. We say ‘thank you’ by being kind, brave, and close to Him every day."
    dyk:
      q: "What does it mean to be ‘anointed’?"
      a: "It means you're a little soldier for Jesus — chosen to do good and share His love!"

# ---- Hymn metadata (demo player) ----
hymnInfo:
  "The Seal (Hatma)":
    dur: 95
    lyrics:
      - tr: "By the Holy Mooron, the fragrance of Christ,"
        en: "the sign and seal of the true faith,"
      - tr: "and the completion of the gift of the Holy Spirit."
        en: "As you are sealed with the Spirit, may you shine with the light of Christ."
      - note: "Sung as the priest seals the newly baptized with the sign of the Cross."

# ---- Quizzes (Kids mode — one per part, at the end of each part) ----
quizzes:
  - questions:
      - q: "What does the Holy Mooron give us?"
        opts: ["The gift of the Holy Spirit", "A new name", "A loaf of bread"]
        a: 0
        why: "Mooron is the Sacrament of the Holy Spirit — it seals us with God's Spirit."
      - q: "Baptism and Chrismation are…"
        opts: ["Completely separate", "Two mysteries that go together", "The same thing"]
        a: 1
        why: "Baptism joins us to Christ; Mooron seals us with His Spirit. They belong together."
      - q: "What does the Syriac word ‘Hatma’ mean?"
        opts: ["Fire", "The seal", "Water"]
        a: 1
        why: "‘Hatma’ means ‘the seal’ — the mark that we belong to God forever."
  - questions:
      - q: "What is the Holy Mooron made from?"
        opts: ["Just water", "Olive oil, balsam, wine and forty spices", "Milk and honey"]
        a: 1
        why: "It's a fragrant mix of olive oil, balsam, wine, and forty aromatic substances."
      - q: "Who consecrates the Holy Mooron?"
        opts: ["The Catholicos", "Any child", "The choir"]
        a: 0
        why: "The Catholicos, the chief bishop, blesses the Mooron for the whole Church."
      - q: "How much of the body does the priest anoint?"
        opts: ["Only the hands", "From the forehead to the feet", "Only the forehead"]
        a: 1
        why: "Every part — forehead, senses, heart, hands and feet — is consecrated to God."
  - questions:
      - q: "How many times in your life do you receive Holy Mooron?"
        opts: ["Once", "Every Sunday", "Every year"]
        a: 0
        why: "Only once — because God's seal lasts forever and is never repeated."
      - q: "Mooron is like a personal…"
        opts: ["Pentecost", "Birthday party", "Holiday"]
        a: 0
        why: "The same Spirit who came at Pentecost comes to each person through the Mooron."
      - q: "Being ‘anointed’ means we are called to…"
        opts: ["Do whatever we want", "Live for God and serve others", "Stay quiet"]
        a: 1
        why: "The anointed are set apart for holy, faithful, loving service."

finalQuiz:
  questions:
    - q: "Which sacrament seals us with the Holy Spirit?"
      opts: ["Holy Mooron", "Confession", "Matrimony"]
      a: 0
      why: "Holy Mooron (Chrismation) is the Sacrament of the Holy Spirit."
    - q: "What completes the new life begun in Baptism?"
      opts: ["Chrismation", "A feast", "Nothing"]
      a: 0
      why: "Chrismation completes and perfects what Baptism begins."
    - q: "What does the seal of the Mooron tell us?"
      opts: ["That we belong to God forever", "That we are tall", "Nothing"]
      a: 0
      why: "The eternal seal marks us as God's own children, forever."
    - q: "The Mooron's sweet fragrance is a sign of…"
      opts: ["The presence of the Holy Spirit", "Dinner", "A flower shop"]
      a: 0
      why: "Its fragrance is the very presence of the Spirit, made perceivable."
    - q: "How is the Holy Mooron applied to the body?"
      opts: ["From the forehead to the feet", "Only on shoes", "It isn't"]
      a: 0
      why: "The whole person is anointed, crown to sole, in the sign of the Cross."

# ---- Shlomo the dove guide (kids mode) ----
mascot:
  name: "Shlomo"
  intro: "Shlomo! That means ‘Peace!’ 🕊️ I'm a little dove — just like the Holy Spirit who comes in the Mooron. Want to learn how God seals us as His own?"
  done: "You learned all about the Holy Mooron! 🌟 Now you know how God seals us with His Spirit and makes us His forever. Peace be with you!"
