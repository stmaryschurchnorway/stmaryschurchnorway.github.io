# Holy Mooron (Chrismation) — content data for the shared carousel engine.
# Rendered by qurbana.js via window.QDATA. Image paths: stage `img` is relative
# to /assets/img/ ; item `img` is a full path from the page.

title: "Holy Mooron"
ns: "mooron"          # localStorage namespace — keeps progress separate from Qurbana
# no subPhase — Mooron has no sub-parts

phaseTitles:
  - "The Mystery of Chrismation"
  - "The Sacred Oil & the Ritual"
  - "Living in the Seal"

phaseNums:
  - "PART 1"
  - "PART 2"
  - "PART 3"

subNames: []

stages:
  # ===== PART 1 — THE MYSTERY =====
  - p: 0
    s: null
    title: "The Fulfillment of Baptism"
    ml: "മാമോദീസയുടെ പൂർണത"
    tr: "Mamodisayude Poornatha"
    img: "stages/immersion.webp"
    flat: true
    desc: "The Holy Mooron is the Sacrament of the Holy Spirit. While Baptism unites us to Christ's death and resurrection, Chrismation seals us with His Spirit — completing what the waters begin."
    subs:
      - title: ""
        significance: "While Baptism incorporates us into Christ's resurrection, Chrismation makes us partakers of His Spirit. The two mysteries are inseparable — one is incomplete without the other."
        theology: "Baptism is death and resurrection with Christ; Chrismation is the living of that resurrection through the power of the Holy Spirit. Baptism washes away sin and brings us into the life of Christ; Chrismation empowers us to live that life by the indwelling of the Spirit."
        biblical: "‘Do you not know that so many of us as were baptized into Jesus Christ were baptized into His death?’ (Romans 6:3). ‘The same Spirit which raised Jesus from the dead dwells in you’ (Romans 8:11). ‘You received the mark of ownership, the Holy Spirit of the promise’ (Ephesians 1:13-14)."
        spiritual: "What begins in the waters of baptism is perfected in the anointing with the Holy Spirit. The baptized do not stand alone but are strengthened by the very presence of the Holy Ghost."

  - p: 0
    s: null
    title: "Scriptural Roots — Baptism & Pentecost"
    ml: "വേദപരമായ അടിത്തറ"
    tr: "Vedaparamaaya Adittara"
    img: "stages/creed.webp"
    flat: true
    desc: "What happened to Christ at the Jordan, and to the Church at Pentecost, happens to each believer in Chrismation — the descent of the Holy Spirit, made personal."
    subs:
      - title: ""
        theology: "Christ Himself was anointed at His baptism: ‘The Spirit of God descended upon Him’ (Matthew 3:16). At Pentecost the Spirit was poured out upon the whole Church — ‘They were all filled with the Holy Ghost’ (Acts 2:4). Chrismation personalizes this Pentecost for each individual believer."
        biblical: "‘Jesus, being baptized, and praying, the heaven was opened, and the Holy Ghost descended in a bodily shape like a dove upon Him’ (Luke 3:21-22). ‘I send the promise of my Father upon you... until ye be endued with power from on high’ (Luke 24:49)."
        spiritual: "Just as the Spirit descended upon Christ and upon the Church at Pentecost, so the Spirit descends upon each of the faithful through the seal of the Holy Mooron — the meeting of heaven and earth."

  - p: 0
    s: null
    title: "The Seal — Identity & Protection"
    ml: "ഹത്മാ — അടയാളവും സംരക്ഷണവും"
    tr: "Hatma — Seal and Protection"
    img: "stages/chrismation.webp"
    flat: true
    pivot: true
    desc: "‘Mooron’ comes from the Greek muron, ‘fragrance’; in Syriac the anointing is the Hatma, ‘the seal.’ This seal is eternal and cannot be repeated — it marks the baptized forever as Christ's own."
    subs:
      - title: ""
        theology: "Once a believer is sealed with the Holy Mooron, that seal remains forever, marking them as belonging to Christ and members of His body. The seal is also a sign of divine protection: ‘In Him you also were sealed with the Holy Spirit of promise, which is the guarantee of our inheritance’ (Ephesians 1:13)."
        biblical: "‘Set me as a seal upon thy heart, as a seal upon thine arm; for love is strong as death’ (Song of Songs 8:6). ‘You have an anointing from the Holy One, and you know all things’ (1 John 2:20). ‘The Lord knows those who are His’ (2 Timothy 2:19)."
        spiritual: "The seal marks the baptized forever as children of God. Once sealed, no power of evil can claim them — they belong to Christ and are protected by the Almighty."

  # ===== PART 2 — THE SACRED OIL & RITUAL =====
  - p: 1
    s: null
    title: "The Holy Myron — Sacred Composition"
    ml: "മൂറോന്റെ പ്രാകരണം"
    tr: "Mooroninte Prakaranam"
    img: "stages/pouring-mooron.webp"
    flat: true
    desc: "The Mooron is a consecrated mixture of olive oil, balsam, wine, and forty aromatic substances — each ingredient carrying spiritual meaning. It is newly consecrated by the Catholicos roughly once a decade (most recently 2009 and 2018)."
    subs:
      - title: "The Four Sacred Ingredients"
        significance: "Olive oil — the base, symbolizing our rootedness in the True Olive Tree (Christ), light-bearing and life-giving. Balsam — poured over the oil, the divine nature poured upon human nature, the sweetness and healing balm of the Spirit. Wine — joy, covenant, and the sacrificial blood of Christ. Forty aromatic substances — the manifold gifts of the Spirit, rising as a sweet fragrance before God; the number forty recalling Christ's temptation, Israel's wandering, and Lent."
        theology: "Olive oil and balsam blend together to represent the union of the divine and human natures in Christ, and the union of God and the baptized through the Spirit. This mingling of oils is itself a sign that what seems impossible in nature becomes possible in grace."
        ritual: "The Catholicos raises the sacred vessels, makes three crosses over each vase invoking the Trinity, and slowly pours the balsam over the olive oil while praying the ancient prayer of consecration. The Mooron is then carried in solemn procession through the four cardinal directions of the church."
        biblical: "‘His name is Myron poured out’ (Song of Songs 1:3). ‘The anointing which you received from Him abides in you’ (1 John 2:27)."

  - p: 1
    s: null
    title: "The Anointing Ceremony"
    ml: "അഭിഷേക ശുശ്രൂഷ"
    tr: "Abhisheka Shushroosha"
    img: "stages/anointing-oil.webp"
    flat: true
    desc: "The newly baptized child, dried and clothed in white, is sealed on the forehead with the sign of the Cross — then anointed from crown to sole, consecrating the whole person to God."
    subs:
      - title: "Sealing the Whole Person"
        ritual: "The Priest dips his right thumb in the Holy Mooron and signs the cross on the forehead: ‘…the sign and seal of the true faith, and the perfection of the gift of the Holy Spirit, [Name] is sealed, in the Name of the Father, and of the Son, and of the living and Holy Spirit. Amen.’ He then anoints the organs of sense — eyes, ears, nostrils, mouth — then the heart, shoulders and chest, the hands, and the feet, proceeding from crown to sole in the sign of the Cross."
        theology: "The anointing marks the entire person as belonging to God — no part left untouched by grace. The senses are consecrated to perceive divine truth, the hands for righteous works, the feet to walk in holiness, the heart as the seat of faith and love. The whole person becomes the temple of the Holy Spirit."
        biblical: "‘God anointed Jesus of Nazareth with the Holy Spirit and with power’ (Acts 10:38). ‘How beautiful are the feet of them that preach the gospel of peace’ (Romans 10:15)."
        hymn:
          name: "The Seal (Hatma)"
        spiritual: "From crown to sole, the baptized are marked with the fragrance of Christ. The Mooron that touches the skin becomes a living reminder that the Spirit dwells within."

  # ===== PART 3 — LIVING IN THE SEAL =====
  - p: 2
    s: null
    title: "A Personal Pentecost"
    ml: "വ്യക്തിഗത പെന്തക്കോസ്ത്"
    tr: "Vyaktigatha Pentecost"
    img: "stages/creed.webp"
    flat: true
    desc: "What the Spirit did for the whole Church at Pentecost, He now does for each believer personally. The Spirit is no longer a distant gift but the very life dwelling within."
    subs:
      - title: ""
        theology: "At Pentecost the apostles heard a mighty rushing wind, and tongues of fire rested on each of them; from that moment they were empowered as witnesses to Christ. Chrismation is the Church saying: ‘What the Spirit did then for the whole community, He does now for you personally.’"
        biblical: "‘And when the day of Pentecost was fully come, they were all with one accord in one place. And suddenly there came a sound from heaven as of a rushing mighty wind’ (Acts 2:1-3). ‘Thou anointest my head with oil; my cup runneth over’ (Psalms 23:5)."
        spiritual: "Every baptized believer is granted a Pentecost of their own — the pouring out of the Holy Spirit, personalized and permanent. The fragrance of the Mooron is that same wind and fire, made tangible."

  - p: 2
    s: null
    title: "The Permanence of the Seal"
    ml: "ഹത്മയുടെ ശാശ്വതത"
    tr: "Hatmayude Shaswathatha"
    img: "stages/chrismation.webp"
    flat: true
    desc: "Unlike Confession or Holy Qurbana, Chrismation is performed only once. The seal of the Mooron can never be undone — it is God's promise that the baptized belong to Him eternally."
    subs:
      - title: ""
        theology: "Once a person has been sealed with the Holy Mooron, that seal remains forever. It cannot be undone, even by sin or apostasy (though sin may require penance and reconciliation). The seal is a one-time gift that echoes throughout the person's entire life."
        biblical: "‘Grieve not the holy Spirit of God, whereby ye are sealed unto the day of redemption’ (Ephesians 4:30). ‘In Him you also were sealed with the Holy Spirit of promise, which is the guarantee of our inheritance’ (Ephesians 1:13-14)."
        spiritual: "Once sealed, always sealed. No power, no circumstance, no failing of faith can erase what God has sealed."

  - p: 2
    s: null
    title: "Living as the Anointed"
    ml: "അഭിഷിക്തരായി വാഴുക"
    tr: "Abhishiktaraayi Vaazhuka"
    img: "stages/anointing-oil.webp"
    flat: true
    desc: "To be anointed is not merely to receive a sacrament but to enter a new way of living — called as ‘soldiers of Christ,’ armed with the fullness of the Spirit's gifts."
    subs:
      - title: ""
        theology: "The anointed are called to resist evil, grow in holiness, bear witness to Christ, and live as His faithful servants. The anointing is both an achievement and a beginning — it completes the initiation begun at baptism, yet opens the door to a lifetime of growth in grace."
        biblical: "‘Be filled with the Spirit; speaking to yourselves in psalms and hymns and spiritual songs’ (Ephesians 5:18-19). ‘For we are His workmanship, created in Christ Jesus for good works’ (Ephesians 2:10)."
        spiritual: "To be anointed is to be set apart — not for pride or privilege, but for humble, faithful service in the Kingdom of God."

