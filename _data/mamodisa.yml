# ---- Kid-friendly glossary ----
glossary:
  Mamodisa: "The Malayalam word for Holy Baptism — being born again in water, washing away sin and joining us to Christ."
  Baptism: "The sacrament of new birth in water, by which we become children of God and members of the Church."
  catechumen: "Someone preparing to be baptized — a ‘learner’ being received into the Church."
  Godparent: "A sponsor who holds the child, speaks the vows for them, and helps guide their faith for life."
  font: "The special basin (Mamodisa Thotti) that holds the holy baptismal water — like a tomb and a womb at once."
  Mooron: "Sweet holy oil — olive oil, balsam, wine and forty spices — used to seal us with the Holy Spirit."
  Chrismation: "Being sealed with the Holy Spirit using Holy Mooron, right after the water of Baptism."
  Hatma: "A Syriac word meaning ‘the seal’ — the mark that we belong to God forever."
  Creed: "The ancient statement of what Christians believe about God the Father, Son, and Holy Spirit."
  Trinity: "The one God in three Persons: the Father, the Son, and the Holy Spirit."
  Eucharist: "The Holy Qurbana — receiving the Body and Blood of Christ."
  Catholicos: "The chief bishop who consecrates the Holy Mooron for the whole Church."

# ---- Per-stage simplified text + “Did you know?” (Shlomo, kids mode) ----
stageExtras:
  "Making of a Catechumen":
    simple: "Baptism starts at the church door! The priest gently breathes on the baby three times — like God breathing life into us — to welcome the Holy Spirit."
    dyk:
      q: "Why does the priest breathe on the child?"
      a: "It remembers how God breathed life into Adam, and how Jesus breathed the Holy Spirit on His friends!"
  "The First Cross — Sealing of the Father":
    simple: "The priest draws a little cross on the forehead for God the Father. There's no oil yet — because we can't see the Father, but He sees and loves us."
    dyk:
      q: "How many crosses are drawn on the forehead?"
      a: "Three! One for the Father, one for the Son, and one for the Holy Spirit."
  "The Rejection of Satan":
    simple: "Facing west (the dark side), we say ‘No!’ to all bad things three times. Then we're ready to turn toward Jesus, the Light."
    dyk:
      q: "Which way do we face to say ‘no’ to evil?"
      a: "West — toward the darkness. Then we turn East, toward the light of Christ!"
  "Acceptance of Christ & the Creed":
    simple: "Now we turn east toward the light and say what we believe — that God is our Father, Jesus is Lord, and the Holy Spirit is God too."
    dyk:
      q: "Why do we face East?"
      a: "East is where the sun rises — a picture of Jesus rising from the dead, and of Paradise!"
  "The Scripture Readings":
    simple: "The Bible is read aloud over the child. It tells us that in Baptism we go down with Jesus and come up to a brand-new life."
    dyk:
      q: "Who really does the baptizing?"
      a: "Jesus Himself! The priest's hands move, but Christ baptizes with the Holy Spirit."
  "The Blessing of the Water":
    simple: "The priest breathes on the water and asks the Holy Spirit to make it holy — turning ordinary water into the holy river Jordan!"
    dyk:
      q: "What river does the water become like?"
      a: "The Jordan — the very river where Jesus was baptized!"
  "Pouring the Mooron into the Water":
    simple: "The priest pours sweet holy oil (Mooron) into the water in the shape of a cross. Now the water smells like heaven and is full of the Spirit."
    dyk:
      q: "What happens when oil meets water?"
      a: "They usually don't mix — but here it's a sign of a miracle: God joining with us!"
  "The Second Cross — Rushmo":
    simple: "The child is rubbed with holy oil from head to toe — like a little athlete getting ready for a big race for Jesus!"
    dyk:
      q: "What does the oil make the child?"
      a: "‘An athlete for Christ’ — strong and ready for the new life ahead."
  "The Immersion":
    simple: "Three times the child goes into the water — Father, Son, and Holy Spirit! The old self is washed away and a child of God comes up new."
    dyk:
      q: "Why three times in the water?"
      a: "For the three days Jesus was in the tomb — and for the three Persons of the Trinity!"
  "Chrismation — The Third Cross":
    simple: "Now the sweet Mooron seals the child with the Holy Spirit — on the forehead, eyes, ears, hands and feet. God says, ‘You are Mine forever!’"
    dyk:
      q: "Can this seal ever come off?"
      a: "Never! It's forever — that's why Chrismation happens only once."
  "The White Robe (Vellakuppayam)":
    simple: "The child is dressed in a beautiful white robe — a sign of being clean, new, and shining like the saints in heaven."
    dyk:
      q: "What does the white robe mean?"
      a: "That we've ‘put on Christ’ — clean and bright as snow, like a little saint!"
  "The Crowning (Kireedam)":
    simple: "A crown is placed on the child's head! In God's Kingdom every baptized person is a little king or queen — and a priest too."
    dyk:
      q: "How long is the crown kept?"
      a: "Seven days! The whole home becomes a little church during that week."
  "The Procession (Kukilion)":
    simple: "Everyone walks around the altar three times singing happy songs — welcoming the new little Christian into God's big family!"
    dyk:
      q: "How many times do they circle the altar?"
      a: "Three times — with joyful hymns, like a birthday parade for the new child of God!"
  "Holy Communion (Qurbana)":
    simple: "Finally, even the tiny baby receives Holy Communion — a drop of Jesus' Body and Blood. Now the child is fully part of the Church!"
    dyk:
      q: "Does the baby receive Communion too?"
      a: "Yes! In our Church, even infants receive Holy Qurbana on their baptism day."
  "The Final Blessing (Samapanam)":
    simple: "The priest blesses the happy family and sends them home in peace. The baby is now a full child of God — sealed, crowned, and loved forever!"
    dyk:
      q: "Is the blessing an ending?"
      a: "No — it's a beginning! A whole new life with God starts now."

