# ---- Quizzes (Kids mode — one per part) ----
quizzes:
  - questions:
      - q: "Where does the baptism service begin?"
        opts: ["At the entrance of the church", "On the roof", "In the garden"]
        a: 0
        why: "It begins at the entrance of the nave, where the child is received as a catechumen."
      - q: "What does the priest do to welcome the Holy Spirit?"
        opts: ["Rings a bell", "Breathes on the child three times", "Claps"]
        a: 1
        why: "He breathes on the child's face three times in the sign of the Cross — like God breathing life into Adam."
      - q: "To renounce Satan, which way do we face first?"
        opts: ["East", "West (darkness)", "Up"]
        a: 1
        why: "We face West to say ‘No’ to evil, then turn East toward the light of Christ."
      - q: "What do we recite facing East?"
        opts: ["The Creed", "A poem", "Nothing"]
        a: 0
        why: "Facing East toward the Light, we profess the Nicene Creed — the faith of the ancient Church."
  - questions:
      - q: "What does the blessed water become like?"
        opts: ["The river Jordan", "Lemonade", "The sea"]
        a: 0
        why: "By the Holy Spirit, the water becomes the Jordan — where Christ Himself was baptized."
      - q: "How many times is the child immersed?"
        opts: ["Once", "Three times", "Ten times"]
        a: 1
        why: "Three times — for the Father, the Son, and the Holy Spirit, and Christ's three days in the tomb."
      - q: "What seals the child with the Holy Spirit after the water?"
        opts: ["Holy Mooron", "Plain water", "A sticker"]
        a: 0
        why: "The sweet Holy Mooron seals the newly baptized — the gift of the Spirit, the ‘Hatma.’"
      - q: "Which way does the child face during immersion?"
        opts: ["East, toward the risen Christ", "Down", "Backwards"]
        a: 0
        why: "Facing East — toward the rising sun and the Resurrection."
  - questions:
      - q: "What is the child dressed in after baptism?"
        opts: ["A white robe", "A raincoat", "Pajamas"]
        a: 0
        why: "The white robe — the ‘garment of light,’ a sign of the new creation in Christ."
      - q: "What is placed on the child's head?"
        opts: ["A crown", "A hat", "A book"]
        a: 0
        why: "A crown (Kireedam) — every baptized person is a king/queen and priest in God's Kingdom."
      - q: "How does the family celebrate the new birth?"
        opts: ["Circle the altar three times singing", "Take a nap", "Go home quietly"]
        a: 0
        why: "They process around the altar three times with joyful hymns (the Kukilion)."
      - q: "How does the rite finally end?"
        opts: ["With Holy Communion", "With a snack", "With homework"]
        a: 0
        why: "Even the infant receives First Holy Communion — completing Christian initiation."

finalQuiz:
  questions:
    - q: "What does the word ‘Mamodisa’ mean?"
      opts: ["Holy Baptism", "A festival", "A hymn"]
      a: 0
      why: "Mamodisa is the Malayalam word for Holy Baptism."
    - q: "How many cross-markings are made on the forehead in the rite?"
      opts: ["Three (Father, Son, Holy Spirit)", "One", "Ten"]
      a: 0
      why: "Three Trinitarian crosses: the Father (no oil), the Son (Oil of Catechumens), the Spirit (Holy Mooron)."
    - q: "In the font, the child dies and rises with…"
      opts: ["Christ", "no one", "the priest"]
      a: 0
      why: "Baptism unites us to Christ's death and resurrection — the old self is buried, a child of God rises."
    - q: "What three sacraments complete Christian Initiation?"
      opts: ["Baptism, Chrismation, Eucharist", "Just Baptism", "Confession and Matrimony"]
      a: 0
      why: "Baptism, Chrismation (Mooron), and Holy Communion together complete initiation."
    - q: "After baptism, every Christian is called a…"
      opts: ["Child of God", "Stranger", "Visitor"]
      a: 0
      why: "‘The child of Adam has become the child of God!’ — fully a member of Christ's Body."

# ---- Shlomo the dove guide (kids mode) ----
mascot:
  name: "Shlomo"
  intro: "Shlomo! That means ‘Peace!’ 🕊️ I'm a little dove — like the Holy Spirit who came down when Jesus was baptized. Want to see how a child becomes a child of God?"
  done: "You followed the whole baptism — from the church door all the way to the altar! 🌟 Now you know how God washes us, seals us, crowns us, and welcomes us into His family. Peace be with you!"
