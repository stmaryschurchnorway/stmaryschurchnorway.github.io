glossary:
  Qurbana: "The Holy Eucharist — the central act of worship, where bread and wine become the Body and Blood of Christ."
  Eucharist: "Greek for “thanksgiving” — another name for the Holy Qurbana."
  Tuyobo: "The quiet preparation rites at the very start of the service, done behind the curtain."
  Madbaha: "The sanctuary — the holiest part of the church at the east end, representing heaven."
  Anaphora: "The central Eucharistic prayer of the service — the one handed down from St. James."
  Epiclesis: "The moment the priest asks the Holy Spirit to come down and change the bread and wine."
  Anamnesis: "The part of the prayer where the Church remembers Christ’s death and resurrection."
  Shushepo: "The large veil that covers the holy vessels during the preparation."
  Trisagion: "The “thrice-holy” hymn: “Holy, Holy, Holy.”"
  Theotokos: "A title for St. Mary meaning “God-bearer” — the Mother of God."
  Censer: "The metal vessel on chains that burns incense, sending up sweet smoke and prayer."
  Paten: "The small plate that holds the holy bread."
  Chalice: "The cup that holds the holy wine."

stageExtras:
  "Procession & Opening Prayers":
    simple: "The priest and deacon walk around the altar swinging the censer, filling the church with sweet-smelling smoke while the opening hymn is sung. The celebration has begun!"
    dyk:
      q: "What is all the smoke for?"
      a: "The rising incense is a picture of our prayers floating up to God (Psalm 141:2). It also helps the whole space feel set apart and holy."
  "Promiun-Sedra & Blessing of the Censer":
    simple: "A set of special prayers is said, and the priest blesses the incense. The sweet smoke stands for Jesus’ offering and for our prayers rising to heaven."
    dyk:
      q: "Why bless the incense?"
      a: "Blessing it sets it apart for God. As it burns, the sweet smell reminds everyone that prayer is a gift offered up to heaven."
  "The Nicene Creed":
    simple: "Everyone says the Creed together — a short summary of the big things Christians believe about God, Jesus, the Holy Spirit, and the Church."
    dyk:
      q: "Why say the same words as everyone else?"
      a: "Saying the Creed together shows we all share one faith — the same beliefs Christians have held for over 1,600 years."
  "Kiss of Peace & Lifting of the Veil":
    simple: "People share a sign of peace with one another, making things right before the great prayer. Then the priest lifts the veil to reveal the holy mysteries."
    dyk:
      q: "Why share peace right now?"
      a: "Jesus said to make peace with others before offering your gift to God (St. Matthew 5:23-24). So we make peace first, then continue."
  "Introductory Dialogue":
    simple: "The priest and people answer back and forth: “Lift up your hearts!” — “We lift them up to the Lord!” It turns everyone’s attention fully toward heaven."
    dyk:
      q: "What does “lift up your hearts” mean?"
      a: "It’s a call to set aside everyday worries and focus completely on God for the most sacred part of the service."
  "Words of Institution":
    simple: "The priest repeats what Jesus said at the Last Supper: “This is my Body… this is my Blood.” These are the very words Jesus used with his disciples."
    dyk:
      q: "Where do these words come from?"
      a: "From the Last Supper, the night before Jesus died (St. Matthew 26:26-28). The Church has repeated them ever since."
  Anamnesis:
    simple: "The Church remembers out loud everything Jesus did to save us — his death, his rising again, and his promise to come back."
    dyk:
      q: "What does “remember” mean here?"
      a: "It’s more than thinking about the past — the Church believes we truly share in Jesus’ saving work as we remember it."
  "Intercessions (Tubden)":
    simple: "The priest prays for everyone — the whole Church, people who are alive, and those who have died — asking God to bless and help them all."
    dyk:
      q: "Why pray for people who have died?"
      a: "Orthodox Christians believe the Church is one big family, and that love and prayer connect us even with those who have passed on."
  Fraction:
    simple: "The priest carefully breaks the holy bread. This breaking is a picture of Jesus’ body, given for us on the cross."
    dyk:
      q: "Why break the bread?"
      a: "Breaking it shows what Jesus did — he gave himself, “broken,” so that everyone could share in his life."
  "The Lord's Prayer":
    simple: "Everyone prays the “Our Father” together — the prayer Jesus himself taught his followers."
    dyk:
      q: "Who wrote the “Our Father”?"
      a: "Jesus did! When his friends asked how to pray, he gave them these words (St. Matthew 6:9-13)."
  "Holy Things to the Holy":
    simple: "The priest lifts the holy gifts and says, “Holy things for the holy people,” inviting those who are ready to come and receive."
    dyk:
      q: "Who are “the holy”?"
      a: "Not perfect people — but those who have prepared their hearts, are sorry for their wrongs, and want to grow closer to God."
  "Post-Communion Service":
    simple: "The service ends with thank-you prayers, a hymn, and a final blessing. Everyone is sent out to live like followers of Jesus in the world."
    dyk:
      q: "Why a blessing at the very end?"
      a: "The blessing sends everyone out with God’s love and protection, ready to share what they received with others."
  "The Preparation (Tuyobo)":
    simple: "Before the service really begins, the priest gets ready behind the curtain. He puts on special robes and carefully sets out the bread and wine — like getting everything ready before a big celebration."
    dyk:
      q: "Why does the priest wear special robes?"
      a: "Each robe stands for something — purity, strength, righteousness. Together they remind everyone that he now serves in the place of Christ, not as himself."
  "Reading of the Scriptures":
    simple: "The Bible is read out loud — letters from the apostles and the words of Jesus — so everyone can hear God’s message together."
    dyk:
      q: "Why do people stand for the Gospel?"
      a: "Standing shows respect, like rising when someone important enters the room. The Gospel is Jesus’ own words."
  "The Anaphora of St. James":
    simple: "Now the most important prayer begins. First the priest washes his hands to show that his heart is clean before touching the holy things."
    dyk:
      q: "Why wash hands that are already clean?"
      a: "It isn’t about dirt — it’s a sign. Clean hands stand for a clean, ready heart before handling something holy (Psalm 24:3-4)."
  "Epiclesis — Invocation of the Holy Spirit":
    simple: "This is the biggest moment. The priest asks the Holy Spirit to come down and change the bread and wine into the Body and Blood of Christ."
    dyk:
      q: "Do the bread and wine look different afterward?"
      a: "No — they still look like bread and wine. The change is real but invisible: it’s about what they truly are, not how they appear."
  "Holy Communion":
    simple: "Everyone who is ready comes forward to receive the Body and Blood of Christ. It joins each person closely to Jesus and to one another."
    dyk:
      q: "Why do we all share from one bread?"
      a: "Sharing one bread is a sign that everyone becomes one family — one body — in Christ."

