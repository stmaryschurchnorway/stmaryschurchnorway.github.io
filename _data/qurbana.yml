quizzes:
  0:
    intro: "You finished the Preparation! Ready for 5 quick questions?"
    questions:
      - q: "What does the word “Tuyobo” mean?"
        opts:
          - "Preparation"
          - "Celebration"
          - "Goodbye"
        a: 0
        why: "“Tuyobo” means preparation — the quiet getting-ready time before the service begins."
      - q: "Where does the priest get ready at the very start?"
        opts:
          - "Behind the curtain, in the Madbaha"
          - "Outside on the church steps"
          - "At the back among the people"
        a: 0
        why: "The preparation happens behind the veil in the Madbaha — the holiest part of the church."
      - q: "What does the priest put on before the Qurbana?"
        opts:
          - "Seven sacred robes"
          - "A warm winter coat"
          - "Nothing special"
        a: 0
        why: "He puts on sacred vestments, each one a reminder that he now serves in the place of Christ."
      - q: "What does the priest gently lay over the bread and wine?"
        opts:
          - "The Shushepo, a great veil"
          - "A paper napkin"
          - "His own hat"
        a: 0
        why: "The Shushepo (great veil) covers the holy gifts, keeping the mystery hidden during the preparation."
      - q: "The hidden preparation reminds us of which part of Jesus’ life?"
        opts:
          - "His 30 quiet years before teaching"
          - "His birthday party"
          - "His trip to the seaside"
        a: 0
        why: "Tuyobo happens out of sight — a picture of the 30 hidden years our Lord lived before His public ministry."
  1:
    intro: "That was the longest part! Try 6 questions about the Public Celebration."
    questions:
      - q: "What rises up like our prayers going to God?"
        opts:
          - "The sweet smoke of incense"
          - "The ringing of bells"
          - "The flickering candles"
        a: 0
        why: "The rising incense is a picture of our prayers floating up to heaven (Psalm 141:2)."
      - q: "At the most important moment, who is asked to change the bread and wine?"
        opts:
          - "The Holy Spirit"
          - "The choir"
          - "The whole crowd"
        a: 0
        why: "In the Epiclesis the priest asks the Holy Spirit to come down and change the gifts into the Body and Blood of Christ."
      - q: "Whose words does the priest repeat from the Last Supper?"
        opts:
          - "Jesus’ own words"
          - "Moses’ words"
          - "A king’s words"
        a: 0
        why: "He repeats what Jesus said: “This is my Body… this is my Blood.”"
      - q: "What do we all say together to declare our faith?"
        opts:
          - "The Nicene Creed"
          - "The alphabet"
          - "A nursery rhyme"
        a: 0
        why: "The Nicene Creed is the Church’s shared statement of faith, proclaimed by everyone together."
      - q: "What sign of love is shared before the great prayer begins?"
        opts:
          - "The Kiss of Peace"
          - "A high five"
          - "A secret handshake"
        a: 0
        why: "The Kiss of Peace is passed through the church — we make peace with one another before the offering."
      - q: "What happens to the holy bread at the Fraction?"
        opts:
          - "It is solemnly broken"
          - "It is hidden away"
          - "It is thrown in the air"
        a: 0
        why: "At the Fraction the consecrated bread is broken, recalling Christ’s body given for the world."
  2:
    intro: "Last one! 5 questions to finish your journey."
    questions:
      - q: "How does the Qurbana come to an end?"
        opts:
          - "With thanksgiving and a blessing"
          - "With a long silence"
          - "With homework"
        a: 0
        why: "It closes with thanksgiving, a hymn, and a final blessing."
      - q: "After receiving communion, what are people sent out to do?"
        opts:
          - "Live like followers of Jesus"
          - "Go home and forget all about it"
          - "Stay in church all day"
        a: 0
        why: "Everyone is sent into the world as a living witness of Christ."
      - q: "What is this closing part especially full of?"
        opts:
          - "Thanksgiving"
          - "Complaints"
          - "Tests"
        a: 0
        why: "The ending is a time to thank God for the gift just received."
      - q: "Receiving Holy Communion joins us closely to whom?"
        opts:
          - "To Jesus and to one another"
          - "To no one"
          - "Only to the priest"
