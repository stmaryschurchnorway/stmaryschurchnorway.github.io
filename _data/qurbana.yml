# Qurbana Carousel — content data
# Edit this file to change all text, stages, hymns, glossary, quizzes, and hotspots.
# Image paths under stages/hotspots are relative to the page (/assets/img/...).

ns: "qurbana"      # localStorage namespace (keeps each page's progress separate)
subPhase: 1        # phase index that shows sub-part pills (Pre-anaphora / Anaphora)

phaseTitles:
  - "The Preparation (Tuyobo)"
  - "Public Celebration"
  - "Post-Communion Service"

phaseNums:
  - "PART 1"
  - "PART 2"
  - "PART 3"

subNames:
  - "Pre-anaphora"
  - "Anaphora"

stages:
  - p: 0
    s: null
    title: "The Preparation (Tuyobo)"
    ml: "ഒരുക്ക ശുശ്രൂഷ"
    tr: "O-ruk-ka Shush-ru-sha"
    img: "tuyobo-v3.webp"
    desc: "Tuyobo means ‘preparation.’ It symbolizes the 30 hidden years of our Lord's life, performed entirely behind the veil within the Madbaha. The priest vests, prepares the bread and wine, and covers the holy elements with the Shushepo."
    audio: "/assets/audio/oruka-shushrusha.m4a"
    subs:
      - title: "The Vesting of the Priest"
        significance: "The priest puts on seven sacred vestments ‘for glory and for beauty’ (Exodus 28:2), symbolizing putting on Christ and the ‘Armor of God’ needed for spiritual struggle. Bishops wear twelve vestments."
        ritual: "The priest washes his hands, symbolizing purity, then dons the sacred vestments in a deliberate, meditative manner."
        theology: "The priest ceases to be an individual and becomes a ‘Living Icon’ of Christ, the Eternal High Priest."
        biblical: "The Church remembers the priestly figures of the Old Testament: Melchizedek, the King-priest of Salem who offered bread and wine."
        items:
          - name: "Cuttanam (Priestly Cap)"
            ml: "കുത്താനം"
            img: "/assets/img/sacred-items/cuttanam_medium.webp"
            meaning: "The black priestly cap worn on the head, symbolizing authority and the covering of thoughts for God."
          - name: "Black Robe (Karathu Kuppayam)"
            ml: "കറുത്ത കുപ്പായം"
            img: "/assets/img/sacred-items/black_robe_medium.webp"
            meaning: "Denotes the sinful nature of humanity, recalling the fall in the Garden of Eden."
          - name: "Surplice (Kutino)"
            ml: "ശ്രുശൂഷ കുപ്പായം"
            img: "/assets/img/sacred-items/surplice_medium.webp"
            meaning: "The white robe of incorruption through the purification of the Holy Spirit, symbolizing purity and holiness."
            bib: "’His clothes were dazzling like the light.’ (Matthew 17:2)"
          - name: "Hamnikho (Stole)"
            ml: "ഹാംനിഖോ"
            img: "/assets/img/sacred-items/hamnikho_medium.webp"
            meaning: "A girdle of strength for defeating enemies; also the breastplate of righteousness."
            bib: "(Psalm 18:39-40; Exodus 28:4)"
          - name: "Zunnoro (Girdle)"
            ml: "സുന്നോറോ"
            img: "/assets/img/sacred-items/zunnoro_medium.webp"
            meaning: "The sword of the triumphant and the belt signifying truth."
            bib: "(Psalm 45:3; Ephesians 6:14)"
          - name: "Zende (Sleeves)"
            ml: "സെന്ദേ"
            img: "/assets/img/sacred-items/zende_medium.webp"
            meaning: "Two sleeves that make the hands instruments of righteousness and good works."
            bib: "(Psalm 18:34-35)"
          - name: "Phayno (Chasuble / Cope)"
            ml: "ഫായ്നോ"
            img: "/assets/img/sacred-items/phayno_medium.webp"
            meaning: "The robe of glory and righteousness — the outermost garment representing the ‘Armor of God.’"
            bib: "(Psalm 132:9-10; 1 Peter 2:9)"
            back: "/assets/img/sacred-items/phayno_back_medium.webp"
          - name: "Msone (Shoes)"
            ml: "മ്സോനെ"
            img: "/assets/img/sacred-items/msone_medium.webp"
            meaning: "Symbolize the gospel of peace, used to trample serpents, scorpions, and all powers of the enemy."
            bib: "(Ephesians 6:15)"
      - title: "Preparation of the Elements"
        significance: "Bread (Lahmo) and Wine (Mazgogo) are arranged on the altar in cross formation, recalling the preparation of the Passover and signifying readiness for the Holy Sacrifice."
        ritual: "The elements are arranged in cross formation; the priest pauses in prayer to remember the faithful living and departed."
        items:
          - name: "Lahmo (Sacred Bread)"
            ml: "ലാഹ്മോ"
            img: "/assets/img/sacred-items/lahmo_medium.webp"
            meaning: "Leavened wheat bread prepared daily — wheat for dust, leaven for air, water and salt for fire and sea."
          - name: "Mazgogo (Sacred Wine)"
            ml: "മാസ്ഗോഗോ"
            img: "/assets/img/sacred-items/mazgogo_medium.webp"
            meaning: "Grape wine mixed with water, reminding us that divinity and humanity are united in the person of our Lord."
          - name: "Pilaso (Paten)"
            ml: "പിലാസോ"
            img: "/assets/img/sacred-items/pilaso_medium.webp"
            meaning: "A flat plate of sacrifice to hold the bread. Represents the Manger of Bethlehem where Christ was laid."
          - name: "Kaso (Chalice)"
            ml: "കാസോ"
            img: "/assets/img/sacred-items/kaso_medium.webp"
            meaning: "A cup of sacrifice used to hold the wine. Represents the Tomb of Joseph of Arimathea where Christ was buried."
          - name: "Tablitho (Altar Stone)"
            ml: "താബ്ലിതോ"
            img: "/assets/img/sacred-items/tablitho_medium.webp"
            meaning: "A consecrated wooden slab upon which the Paten and Chalice are placed, depicted as the tree of life."
          - name: "Kaukubo (Star)"
            ml: "കൗക്കുബോ"
            img: "/assets/img/sacred-items/kaukubo_medium.webp"
            meaning: "A star-shaped frame placed over the Paten, symbolizing the star that appeared at Christ's birth."
      - title: "The Shushepo (Sosappa)"
        significance: "The sacred vessels are covered with the Shushepo, a white cloth symbolizing Christ's burial and the divine mysteries hidden from human understanding."
        ritual: "The Shushepo is drawn over the prepared elements with reverence, completing the hidden preparation phase."
        items:
          - name: "Shushepo (Great Veil)"
            ml: "ശുശെപ്പോ"
            img: "/assets/img/sacred-items/shushepo_medium.webp"
            meaning: "A white cloth covering both Chalice and Paten — the swaddling clothes of Baby Jesus and the seamless garment of our Lord."
            bib: "(Luke 2:7)"
  - p: 1
    s: 0
    title: "Procession & Opening Prayers"
    ml: "പരസ്യമായ ആദ്യഭാഗം"
    tr: "Parasya-maya Adya-bhagam"
    video: "GVt6kFB541s"   # YouTube video of the procession & opening prayers
    desc: "The solemn procession and opening prayers begin the public celebration, gathering the community into the divine service."
    audio: "/assets/audio/parasyam-adhya-bhagam.m4a"
    subs:
      - title: "The Solemn Entrance"
        significance: "A procession around the Altar with the censer, during which ‘Nin Mathavu’ is sung — symbolizing Christ entering His public ministry as the ‘Light of the World.’"
        ritual: "The priest and deacon process solemnly around the altar, the censer swinging to spread incense throughout the sanctuary."
        hymn:
          name: "Nin Mathavu Vishudhanmar — നിൻ മാതാവ് വിശുദ്ധന്മാർ"
          audio: "/assets/audio/hymns/nin-mathavu.mp3"
        items:
          - name: "Dhoopakutty (Censer)"
            ml: "ധൂപക്കുറ്റി"
            img: "/assets/img/sacred-items/dhoopakutty_medium.webp"
            meaning: "The vessel which brings forth the sweet smell of incense, representing the Church and the dedication of oneself to God."
            bib: "(Ephesians 5:2)"
      - title: "The Trisagion (Thrice Holy)"
        significance: "The congregation addresses Christ directly — ‘Holy, Holy, Holy’ (Kadeeshath Aloho) — affirming that the Immortal God suffered in the flesh for our salvation."
        ritual: "The congregation stands and sings in unison, their voices joining the heavenly choir; a slight bow is made at the Crucifixion."
        hymn:
          name: "Kadeeshath Aloho (Holy is God) — കാദീശാത് അലോഹോ"
          audio: "/assets/audio/hymns/kadeeshath-aloho.mp3"
          audio_label: "Malayalam Version"
          audio2: "/assets/audio/hymns/kadeeshath-aloho-syriac.mp3"
          audio2_label: "Syriac Version"
        items:
          - name: "None required"
            meaning: "The focus is on the voice and the unified proclamation of faith."
  - p: 1
    s: 0
    title: "Reading of the Scriptures"
    ml: "വേദപുസ്തക പാരായണം"
    tr: "Vedha-pusthaka Pa-ra-ya-nam"
    img: "reading-scriptures.webp"
    desc: "Scripture is proclaimed through the Epistles and Gospels — the ‘life-giving proclamation’ of Christ's teaching, educating and sanctifying the faithful (St. John 6:63)."
    audio: "/assets/audio/vedhapusthaka-parayana.m4a"
    subs:
      - title: "Ministry of the Word (Epistles & Gospel)"
        significance: "The Epistles (represented by 'Paulose Sleeha Dhanyan' - Blessed Apostle Paul) are read from the Acts or Epistles, representing the teachings of the Apostles. The Gospel is then proclaimed from the center of the Altar, preceded by 'Halleluiah.' The sermon follows, mirroring Christ's teaching in the synagogues."
        ritual: "The deacon reads the Epistles from the lectern while the congregation listens in reverent silence. The Gospel is proclaimed by the priest with great solemnity. Bells are rung and fans are fluttered during the Gospel reading."
        items:
          - name: "Marvahtho (Fans)"
            ml: "മാർവാഹ്തോ"
            img: "/assets/img/sacred-items/marvahtho_medium.webp"
            meaning: "Two persons standing on both sides of the altar make a jingling, pleasing sound by shaking a round object on the top of a long stick. It represents the angels and the fluttering of their wings."
          - name: "Mani (Bells)"
            ml: "മണി"
            img: "/assets/img/sacred-items/mani_medium.webp"
            meaning: "Bells are rung to summon the faithful to worship and to proclaim important occasions during the Qurbana: the Holy birth announcement at the start, the reading of the Gospel, the blessing of the Censer, the celebration of the Shushepo, the blessing of the bread, and the elevation of Paten and Chalice. In ancient times, wooden pieces were used instead of bells. The bell sounds recall the death of our Lord on the wooden Cross and remind us to sign the Cross."
          - name: "Valiya Mani (Church Bell)"
            ml: "വലിയ മണി"
            img: "/assets/img/sacred-items/valiya_mani_medium.webp"
            meaning: "The large bell hung at the church entrance or bell tower, rung to call the faithful to worship from afar. Its deep, resonant sound carries across the parish, announcing the beginning of the Qurbana and other sacred services. The bell's voice represents the call of God summoning His people to gather as one body."
          - name: "Msaknsabino (Tabernacle)"
            ml: "മ്സക്ൻസബിനോ"
            img: "/assets/img/sacred-items/msaknsabino_medium.webp"
            meaning: "A sacred vessel placed on the altar, used to reserve the consecrated Body and Blood of Christ. The reserved sacrament is kept for administering Holy Communion to the sick, the dying, and those unable to attend the Qurbana. The tabernacle represents the dwelling place of God among His people, recalling the Ark of the Covenant in the Holy of Holies."
          - name: "Momsho (Candles)"
            ml: "മോംശോ"
            img: "/assets/img/sacred-items/momsho_medium.webp"
            meaning: "Candles show the presence of God and His Saints — 'I am the Light of the World' (John 1:9). Seven candles are based on the golden lamp of the Jerusalem Temple, or twelve representing the Apostles. During the 1st century persecutions, the Qurbana was conducted at night in underground catacombs where the departed were buried, and candles used for light were kept on the tombs. The Church continued this practice even after persecution ended. The melting candle wax, changed into another shape, is like a person who by rebirth in Christ becomes a new creation."
          - name: "Thaksa (Liturgical Books)"
            ml: "തക്സ"
            meaning: "The liturgical books containing the Anaphora of St. James and other liturgical texts used during the Qurbana. There are approximately 80 different anaphoral versions written by different Holy Fathers throughout Church history, of which only about 20 are in regular use. The primary and foundational anaphora is that of St. James himself, the apostle and first bishop of Jerusalem, whose liturgical structure was taken from oral tradition and codified into written form by the 3rd century, reaching its present form by the 4th century. This apostolic lineage ensures that the Qurbana celebrated today carries the authentic worship practices of the early Church."
  - p: 1
    s: 0
    title: "Promiun-Sedra & Blessing of the Censer"
    ml: "പ്രോമിയോൻ–സേദ്രാ"
    tr: "Pro-mi-yon Se-dra"
    img: "sedra-blessing-v2.webp"
    desc: "Meditative prayers culminate in the blessing of the censer; rising incense signifies Christ's ‘fragrant offering’ and the prayers of the faithful ascending to heaven."
    audio: "/assets/audio/promiyon-sedra.m4a"
    subs:
      - title: "Promiun-Sedra & Blessing of the Censer"
        significance: "The priest leads a series of meditative prayers (Sedra). He then blesses the censer, which burns incense as a symbol of Christ's 'fragrant offering and sacrifice' and the prayers of the faithful rising to heaven. The censer's structure carries deep theological meaning: 4 chains (Father, Spirit, and two natures of the Son) and 12 bells (the 12 Apostles proclaiming the Gospel). The Nicene Creed concludes this section, with the congregation standing in unity."
        ritual: "The priest intones the Sedra prayers with hands raised. The censer is blessed with careful hand movements. The congregation recites the Nicene Creed standing, affirming the 'Church of the Apostles.'"
        items:
          - name: "Dhoopakutty (Censer)"
            ml: "ധൂപക്കുറ്റി"
            img: "/assets/img/sacred-items/dhoopakutty_medium.webp"
            meaning: "Blessed during the Sedra prayers, the censer's incense rises as a fragrant offering symbolizing Christ's sacrifice (Eph 5:2) and the prayers of the faithful ascending to God's throne (Rev 8:3-4)."
          - name: "Nalu Shrinkhangal (4 Chains)"
            ml: "നാലു ശൃഖ്ങ്ങൾ"
            img: "/assets/img/sacred-items/nalu_shrinkhangal_medium.svg"
            meaning: "One for the Father, one for the Holy Spirit, and two for the Son (representing His two natures: Divine and Human)"
          - name: "Pandhrandhu Manikkal (12 Bells)"
            ml: "പന്ത്രണ്ട് മണികൾ"
            img: "/assets/img/sacred-items/pandhrandhu_manikkal_medium.svg"
            meaning: "Represent the 12 Apostles proclaiming the Gospel of Christ to the world"
          - name: "Dhoopam (Incense)"
            ml: "ധൂപം"
            img: "/assets/img/sacred-items/vasnam_medium.webp"
            meaning: "Represents Christ's fragrant offering and sacrifice on the Cross"
  - p: 1
    s: 0
    title: "The Nicene Creed"
    ml: "വിശ്വാസപ്രമാണം"
    tr: "Vish-wa-sa Pra-ma-nam"
    img: "nicene-creed.webp"
    desc: "The congregation proclaims the apostolic faith — the Trinity, the Church, baptism, and the resurrection of the dead — uniting the faithful in orthodox belief."
    audio: "/assets/audio/vishwasa-pramanam.m4a"
    subs:
      - title: "The Recitation of the Nicene Creed"
        significance: "The whole congregation stands together, united in the apostolic faith. They recite the Nicene Creed regarding the Trinity, the Church, baptism, and the resurrection of the dead. This ancient creed, formulated at the Council of Nicaea, guards the mystery of the Incarnation and prepares believers to participate in the sacred Eucharistic mystery."
        ritual: "The faithful stand with reverence, often with hands folded or raised, voicing the creed in unison. This corporate recitation creates a moment of powerful unity among believers across centuries and cultures."
        items:
          - name: "The Creed itself"
            meaning: "The words that express apostolic faith and unite all Orthodox believers in doctrine"
  - p: 1
    s: 1
    title: "The Anaphora of St. James"
    ml: "ശുദ്ധിയും സജ്ജീകരണവും"
    tr: "Shud-dhi-yum Saji-ka-ra-nam"
    img: "anaphora-hand-washing.webp"
    desc: "The Anaphora of St. James — the ancient apostolic Eucharistic prayer at the heart of the Qurbana — begins. With the washing of hands, the priest's heart is purified before touching the sacred mysteries (Psalm 24:3-4)."
    subs:
      - title: "Hand-Washing — The Ritual of Purification"
        significance: "Hand-washing symbolizes the priest's heart purification and spiritual readiness. Hands that will touch and transform the sacred mysteries must be clean not only physically but spiritually and morally. This ancient gesture acknowledges the priest's own need for God's grace and cleansing before acting in Christ's place."
        ritual: "The priest pauses in a moment of quiet prayer. He washes his hands with water and a clean towel—a deliberate, meditative action that centers his consciousness and focus entirely on the sacred work about to unfold. This is not hurried but done with reverence and intention, a visible expression of the interior spiritual work taking place."
        theology: "The washing represents the interior cleansing required before approaching God's holiness. The Psalmist asks, 'Who shall ascend the hill of the Lord? He who has clean hands and a pure heart' (Psalm 24:3-4). The priest recognizes his own unworthiness and dependence upon God's mercy. This moment of purification is not self-justification but a humble acknowledgment that only God can make the unworthy worthy to handle sacred things."
        items:
          - name: "Water (Symbol of Purification)"
            ml: "ജലം"
            img: "/assets/img/sacred-items/water_medium.webp"
            meaning: "Water represents cleansing from sin and unworthiness, echoing both the baptismal waters of rebirth and the priest's acknowledgment of his dependence on God's sanctifying grace. As Christ washed the disciples' feet, so the priest washes his hands, recognizing that all service in the Church flows from God's grace, not human merit."
  - p: 1
    s: 1
    title: "Kiss of Peace & Lifting of the Veil"
    ml: "സമാധാന ചുംബനം"
    tr: "Sa-maa-dha-na Chum-ba-nam"
    img: "kiss-of-peace.webp"
    desc: "The faithful exchange the Kiss of Peace — reconciliation before the Eucharistic prayer. The celebrant unveils the vessels, revealing the ‘life-giving and heavenly mysteries.’"
    audio: "/assets/audio/shoshappa.m4a"
    subs:
      - title: "Reconciliation & The Kiss of Peace"
        significance: "The Kiss of Peace is one of the most ancient and profound gestures of Christian worship. It expresses reconciliation, forgiveness, and unity among the faithful before approaching the Holy Mysteries."
        ritual: "The priest greets the deacon with 'The peace of the Lord be with you,' and the peace is exchanged throughout the congregation with embraces or hand gestures, moving from the altar toward the people."
        theology: "It represents reconciliation with both God and neighbour before offering sacrifice (Matthew 5:23–24). It is a visible expression of the unity of the Body of Christ, where all divisions are healed in love."
        items:
          - name: "None required"
            meaning: "The exchange itself is the sacred action; it carries the peace of Christ"
      - title: "Lifting of the Shushepo (ശുശെപ്പോ)"
        significance: "This solemn act symbolizes the Resurrection of Christ and the revelation of divine mysteries to the Church."
        ritual: "The priest reverently lifts the veil with both hands in a smooth, deliberate motion, then allows it to flutter gently—a gesture reminiscent of Christ emerging from the tomb."
        theology: "The lifting of the veil represents the rolling away of the stone from Christ's tomb. It signifies that death, darkness, and separation have been conquered by the Resurrection. It also represents the opening of heaven to humanity through Christ's victory."
        items:
          - name: "Shushepo / Sosappa (Great Veil)"
            ml: "ശുശേപോ"
            img: "/assets/img/sacred-items/shushepo_medium.webp"
            meaning: "When lifted, the Shushepo's removal symbolizes the rolling away of the stone from Christ's tomb (Matthew 28:2). Its gentle fluttering represents Christ rising from the dead, revealing the divine mysteries once hidden and now made accessible through the Holy Eucharist."
  - p: 1
    s: 1
    title: "Introductory Dialogue"
    img: "introductory-dialogue.webp"
    desc: "‘Lift up your hearts’ — ‘We lift them up unto the Lord.’ This ancient dialogue lifts the congregation from earthly preparation into heavenly worship."
    subs:
      - title: "The Sacred Dialogue"
        significance: "This ancient dialogue, unchanged since the early Church, invites the faithful to ascend spiritually with the priest into heavenly worship. The priest begins: 'Lift up your hearts.' The people respond: 'We lift them up unto the Lord.' The priest continues: 'Let us give thanks to the Lord our God.' The people affirm: 'It is meet and right.' This mutual exchange signifies the unity of the earthly and heavenly Church as both participate in one eternal Liturgy."
        ritual: "The priest stands before the altar with arms raised, speaking with solemnity. The congregation responds in unison, with some standing with arms slightly raised in a gesture of lifting up the heart and mind to heaven."
        items:
          - name: "None required"
            meaning: "The words themselves carry the sacred power; they are an ancient apostolic tradition"
  - p: 1
    s: 1
    title: "Words of Institution"
    ml: "സ്ഥാപന വാക്യങ്ങൾ"
    tr: "Sthapana Vakhyangal"
    img: "words-of-institution-v4.webp"
    desc: "The priest recounts Christ's words at the Last Supper: ‘Take, eat — this is My Body… Drink — this is My Blood of the New Covenant’ (St. Matthew 26:26-28)."
    audio: "/assets/audio/sthapana-vakhyangal.m4a"
    subs:
      - title: "The Eucharistic Prayer & Institution"
        significance: "This is the sacred moment in which the Church commemorates and mystically participates in the Last Supper of our Lord."
        ritual: "The priest stands with reverence, speaking slowly and clearly the words 'With His holy hands...' (Thante Thrikkai...). At the crucial moment, he makes the sign of the cross over the elements with his hand, a gesture that communicates the sacrificial love of Christ crucified."
        theology: "Christ Himself is the true celebrant of the Eucharist through the priest. The words spoken are not merely historical recollection but a living re-presentation of the mystery of salvation. The bread and wine are set apart as the Body and Blood of Christ in sacramental reality."
        items:
          - name: "Lahmo (Sacred Bread)"
            ml: "ലാഹ്മോ"
            img: "/assets/img/sacred-items/lahmo_medium.webp"
            meaning: "About to become the Body of Christ through the invocation of the Holy Spirit"
          - name: "Mazgogo (Sacred Wine)"
            ml: "മാസ്ഗോഗോ"
            img: "/assets/img/sacred-items/mazgogo_medium.webp"
            meaning: "About to become the Blood of Christ through the invocation of the Holy Spirit"
  - p: 1
    s: 1
    title: "Anamnesis"
    ml: "ഓർമ്മപ്രാർത്ഥന"
    tr: "Or-mma Prar-tha-na"
    img: "anamnesis.webp"
    desc: "The Church's solemn remembrance of Christ's saving works — His passion, death, resurrection, and awaited second coming."
    audio: "/assets/audio/ormma-prarthana-krutajnyata.m4a"
    subs:
      - title: "Memorial of Christ's Redemptive Works"
        significance: "The priest proclaims the great acts of salvation: Christ's passion on the Cross, His burial in the tomb, His glorious resurrection on the third day, His ascension to heaven, and His anticipated return in glory to judge the living and the dead. Through this sacred remembrance, the Church mystically enters into Christ's redemptive mystery, bringing all of time and eternity into the present moment of worship. The past becomes present, and the future is anticipated as faith."
        ritual: "The priest stands with reverence, often with arms extended slightly as if embracing all of history—past, present, and future—in the remembrance. The voice carries solemnity and conviction."
        items:
          - name: "None required"
            meaning: "The remembrance itself is the sacred action; all of history is held in this moment"
  - p: 1
    s: 1
    title: "Epiclesis — Invocation of the Holy Spirit"
    ml: "പരിശുദ്ധാത്മാവിന്റെ എഴുന്നള്ളത്ത്"
    tr: "Parishuddhaathmavinte Ezunnathathu"
    img: "epiclesis-v2.webp"
    pivot: true
    desc: "With uplifted hands the priest cries, ‘Holy Father, send down Your Holy Spirit upon these gifts.’ This is the pivot of the entire Qurbana — where bread and wine become, in real sacramental presence, the Body and Blood of Christ."
    audio: "/assets/audio/parishuddhaathmavinte-ezunnathathu.m4a"
    subs:
      - title: "Epiclesis - The Invocation of the Holy Spirit"
        significance: "The Epiclesis is the most solemn invocation of the Holy Spirit upon the offered gifts. It is the moment when the earthly becomes heavenly, the natural becomes supernatural, and bread and wine become the living Body and Blood of Christ."
        ritual: "The priest stands facing the altar with both arms raised and extended over the elements in a gesture reminiscent of a dove's wings—the symbol of the Holy Spirit. His hands may flutter slightly as he invokes the Holy Spirit with words of absolute dependence. The congregation may also raise their hands in intercession and speechless wonder at this mystery. All present recognize that they are witnessing what angels themselves desire to look into—the transformation wrought by God's eternal power."
        theology: "The Epiclesis reflects the work of the Holy Spirit at creation ('Let there be light'), at the Incarnation ('The Holy Spirit will come upon you'), and at Pentecost ('They were all filled with the Holy Ghost'). The Spirit continues this work of transformation and sanctification in the Church, making the impossible possible."
        items:
          - name: "Lahmo (Sacred Bread)"
            ml: "ലാഹ്മോ"
            img: "/assets/img/sacred-items/lahmo_medium.webp"
            meaning: "About to be transformed into the Body of Christ through the Holy Spirit's power"
          - name: "Mazgogo (Sacred Wine)"
            ml: "മാസ്ഗോഗോ"
            img: "/assets/img/sacred-items/mazgogo_medium.webp"
