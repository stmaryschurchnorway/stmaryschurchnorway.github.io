- text: "കർത്താവ് എന്റെ ഇടയനാകുന്നു; എനിക്കു മുട്ടുണ്ടാകയില്ല."
  text_en: "The Lord is my shepherd; I shall not want."
  author: "സങ്കീർത്തനം 23:1"
  author_en: "Psalm 23:1"
  bible_url: "https://www.bible.com/bible/1693/PSA.23.1.MALOVBSI"

- text: "ഞാൻ തന്നേ വഴിയും സത്യവും ജീവനും ആകുന്നു."
  text_en: "I am the way, the truth, and the life."
  author: "യോഹന്നാൻ 14:6"
  author_en: "John 14:6"
  bible_url: "https://www.bible.com/bible/1693/JHN.14.6.MALOVBSI"

- text: "എന്നെ ശക്തനാക്കുന്നവൻ മുഖാന്തരം ഞാൻ സകലത്തിനും മതിയാകുന്നു."
  text_en: "I can do all things through Him who strengthens me."
  author: "ഫിലിപ്പിയർ 4:13"
  author_en: "Philippians 4:13"
  bible_url: "https://www.bible.com/bible/1693/PHP.4.13.MALOVBSI"

- text: "ഭയപ്പെടേണ്ടാ, ഞാൻ നിന്നോടുകൂടെ ഉണ്ട്."
  text_en: "Fear not, for I am with you."
  author: "യെശയ്യാവ് 41:10"
  author_en: "Isaiah 41:10"
  bible_url: "https://www.bible.com/bible/1693/ISA.41.10.MALOVBSI"

- text: "ദൈവം സ്നേഹം ആകുന്നു."
  text_en: "God is love."
  author: "1 യോഹന്നാൻ 4:8"
  author_en: "1 John 4:8"
  bible_url: "https://www.bible.com/bible/1693/1JN.4.8.MALOVBSI"

- text: "കർത്താവിൽ എപ്പോഴും സന്തോഷിപ്പിൻ; സന്തോഷിപ്പിൻ എന്നു ഞാൻ പിന്നെയും പറയുന്നു."
  text_en: "Rejoice in the Lord always; again I will say, rejoice!"
  author: "ഫിലിപ്പിയർ 4:4"
  author_en: "Philippians 4:4"
  bible_url: "https://www.bible.com/bible/1693/PHP.4.4.MALOVBSI"

- text: "അടങ്ങിയിരുന്നു ഞാൻ ദൈവം എന്നു അറിവിൻ."
  text_en: "Be still, and know that I am God."
  author: "സങ്കീർത്തനം 46:10"
  author_en: "Psalm 46:10"
  bible_url: "https://www.bible.com/bible/1693/PSA.46.10.MALOVBSI"

- text: "നിങ്ങൾ ലോകത്തിന്റെ വെളിച്ചം ആകുന്നു."
  text_en: "You are the light of the world."
  author: "മത്തായി 5:14"
  author_en: "Matthew 5:14"
  bible_url: "https://www.bible.com/bible/1693/MAT.5.14.MALOVBSI"

- text: "വിശ്വാസം, പ്രത്യാശ, സ്നേഹം ഈ മൂന്നും നിലനിൽക്കുന്നു; ഇവയിൽ വലിയതോ സ്നേഹം തന്നേ."
  text_en: "And now these three remain: faith, hope, and love. But the greatest of these is love."
  author: "1 കൊരിന്ത്യർ 13:13"
  author_en: "1 Corinthians 13:13"
  bible_url: "https://www.bible.com/bible/1693/1CO.13.13.MALOVBSI"

- text: "കർത്താവിങ്കൽ പ്രത്യാശ വെക്കുന്നവർ ബലം പുതുക്കും; അവർ കഴുകനെപ്പോലെ ചിറകു അടിച്ചുയരും."
  text_en: "Those who hope in the Lord will renew their strength; they will soar on wings like eagles."
  author: "യെശയ്യാവ് 40:31"
  author_en: "Isaiah 40:31"
  bible_url: "https://www.bible.com/bible/1693/ISA.40.31.MALOVBSI"

- text: "എന്റെ കൃപ നിനക്കു മതി; എന്റെ ശക്തി ബലഹീനതയിൽ തികഞ്ഞുവരുന്നു."
  text_en: "My grace is sufficient for you, for my power is made perfect in weakness."
  author: "2 കൊരിന്ത്യർ 12:9"
  author_en: "2 Corinthians 12:9"
  bible_url: "https://www.bible.com/bible/1693/2CO.12.9.MALOVBSI"

- text: "സകലബുദ്ധിയേയും കവിയുന്ന ദൈവസമാധാനം നിങ്ങളുടെ ഹൃദയങ്ങളെ കാക്കും."
  text_en: "The peace of God, which surpasses all understanding, will guard your hearts."
  author: "ഫിലിപ്പിയർ 4:7"
  author_en: "Philippians 4:7"
  bible_url: "https://www.bible.com/bible/1693/PHP.4.7.MALOVBSI"

- text: "ഞാൻ ലോകാവസാനത്തോളം എല്ലാനാളും നിങ്ങളോടുകൂടെ ഉണ്ട്."
  text_en: "I am with you always, to the very end of the age."
  author: "മത്തായി 28:20"
  author_en: "Matthew 28:20"
  bible_url: "https://www.bible.com/bible/1693/MAT.28.20.MALOVBSI"

- text: "കർത്താവേ, നിന്റെ വഴികൾ എനിക്കു കാണിച്ചുതരേണമേ; നിന്റെ പാതകൾ എന്നെ പഠിപ്പിക്കേണമേ."
  text_en: "Show me your ways, Lord; teach me your paths."
  author: "സങ്കീർത്തനം 25:4"
  author_en: "Psalm 25:4"
  bible_url: "https://www.bible.com/bible/1693/PSA.25.4.MALOVBSI"
